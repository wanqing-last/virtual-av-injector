<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>虚拟音视频注入器</title>
<style>
  :root{
    --bg:#0a0e13; --panel:#111820; --panel-2:#0d131a; --line:#1e2a36;
    --line-soft:#182230; --text:#e8eef5; --muted:#8496a8; --dim:#5d6f80;
    --accent:#35d6c8; --accent-2:#6f8cff; --ok:#3ddc97; --warn:#f5b942; --danger:#ff6b6b;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:
      radial-gradient(1100px 600px at 12% -12%, rgba(53,214,200,.10), transparent 60%),
      radial-gradient(900px 520px at 100% 0%, rgba(111,140,255,.09), transparent 55%),
      var(--bg);
    color:var(--text); font:14px/1.55 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden; user-select:none;
  }
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#22303e;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:#2d3e50}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------------- 顶栏 ---------------- */
  .topbar{
    height:62px; display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(17,24,32,.92), rgba(10,14,19,.72));
    backdrop-filter:blur(10px);
  }
  .brand{display:flex;align-items:center;gap:11px}
  .logo{
    width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(140deg,var(--accent),#1c8f9a 55%,var(--accent-2));
    box-shadow:0 6px 18px rgba(53,214,200,.28); font-size:15px; color:#04141a; font-weight:800;
  }
  .brand h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.3px}
  .brand .ver{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
  .top-actions{display:flex;align-items:center;gap:10px}

  .pill{
    display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
    border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 12px 5px 10px;
  }
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .pill.live{color:#bff5ee;border-color:rgba(53,214,200,.4);background:rgba(53,214,200,.10)}
  .pill.live .dot{background:var(--accent);box-shadow:0 0 0 0 rgba(53,214,200,.6);animation:pulse 1.8s infinite}

  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,214,200,.55)}70%{box-shadow:0 0 0 7px rgba(53,214,200,0)}100%{box-shadow:0 0 0 0 rgba(53,214,200,0)}}

  .btn{
    border:1px solid var(--line);background:var(--panel);color:var(--text);
    border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;
    transition:.16s ease; font-family:inherit; display:inline-flex;align-items:center;gap:7px;
  }
  .btn:hover{border-color:#2e4052;background:#16202a;transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),#22a89e);border-color:transparent;color:#04211f;font-weight:700;
    box-shadow:0 6px 18px rgba(53,214,200,.22);
  }
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.danger{border-color:rgba(255,107,107,.35);color:#ffb3b3}
  .btn.danger:hover{background:rgba(255,107,107,.1)}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
  .btn.ghost{background:transparent}

  /* ---------------- 布局 ---------------- */
  main{
    height:calc(100vh - 62px); display:grid; grid-template-columns:352px minmax(0,1fr);
    gap:14px; padding:14px 16px 16px; overflow:hidden;
  }
  .col{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;padding-right:2px}
  .col.stage{overflow:hidden}

  .card{
    background:linear-gradient(180deg,rgba(20,28,37,.85),rgba(13,19,26,.9));
    border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;
    box-shadow:0 8px 26px rgba(0,0,0,.22);
  }
  .card h2{
    margin:0 0 11px;font-size:11.5px;font-weight:600;color:var(--dim);
    letter-spacing:1.4px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;
  }
  .card h2 .hint{letter-spacing:0;text-transform:none;color:#4f6172;font-weight:400}

  /* ---------------- 设备状态 ---------------- */
  .dev{display:flex;gap:11px;align-items:flex-start;padding:9px 0}
  .dev + .dev{border-top:1px dashed var(--line-soft)}
  .dot-lg{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 auto;background:var(--dim)}
  .dot-lg.ok{background:var(--ok);box-shadow:0 0 12px rgba(61,220,151,.75)}
  .dot-lg.bad{background:var(--danger);box-shadow:0 0 12px rgba(255,107,107,.55)}
  .dev-body{min-width:0;flex:1}
  .dev-title{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
  .dev-title .tag{font-size:10px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--dim);font-weight:500}
  .dev-name{
    font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-family:"Cascadia Code",Consolas,monospace;
  }
  .dev-msg{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.45}
  .dev-msg.err{color:#ff9d9d}

  /* ---------------- 表单 ---------------- */
  .field{margin-bottom:10px}
  .field:last-child{margin-bottom:0}
  .label{font-size:11.5px;color:var(--dim);margin-bottom:5px;display:flex;justify-content:space-between}
  select,input[type=text]{
    width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    border-radius:9px;padding:8px 10px;font-size:12.5px;font-family:inherit;outline:none;transition:.15s;
  }
  select:focus,input[type=text]:focus{border-color:rgba(53,214,200,.55);box-shadow:0 0 0 3px rgba(53,214,200,.10)}
  select{cursor:pointer;appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,#5d6f80 50%),linear-gradient(135deg,#5d6f80 50%,transparent 50%);
    background-position:calc(100% - 16px) 15px,calc(100% - 11px) 15px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  }
  .row{display:flex;gap:8px}
  .row > *{min-width:0}
  .seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
  .seg button{
    flex:1;border:0;background:transparent;color:var(--muted);font-size:12px;padding:6px 4px;border-radius:7px;
    cursor:pointer;font-family:inherit;transition:.15s;white-space:nowrap;
  }
  .seg button.on{background:rgba(53,214,200,.14);color:#bff5ee;box-shadow:inset 0 0 0 1px rgba(53,214,200,.28)}
  .seg button:hover:not(.on){color:var(--text);background:rgba(255,255,255,.04)}

  /* ---------------- 预览 ---------------- */
  .stage-main{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
  .preview-card{
    position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:var(--radius);
    background:#05080b radial-gradient(circle at 50% 40%,#0d1a22,#05080b 70%);
    overflow:hidden;display:grid;place-items:center;
  }
  .preview-card img{max-width:100%;max-height:100%;object-fit:contain;display:none}
  .preview-card.has img{display:block}
  .placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#3f5061;font-size:13px;pointer-events:none}
  .preview-card.has .placeholder{display:none}
  .preview-badge{
    position:absolute;top:11px;left:11px;display:flex;gap:6px;align-items:center;
    font-size:11px;padding:4px 9px;border-radius:8px;background:rgba(5,10,14,.72);
    border:1px solid rgba(255,255,255,.08);color:#a9bccd;backdrop-filter:blur(6px);
    font-family:"Cascadia Code",Consolas,monospace;
  }
  .preview-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
  .preview-badge.live .dot{background:#ff5c5c;animation:pulse 1.6s infinite}
  .preview-res{position:absolute;bottom:11px;right:11px;font-size:11px;color:#5f7486;
    font-family:"Cascadia Code",Consolas,monospace;background:rgba(5,10,14,.6);padding:3px 8px;border-radius:7px}

  /* ---------------- 播放控制 ---------------- */
  .transport{background:linear-gradient(180deg,rgba(20,28,37,.85),rgba(13,19,26,.9));
    border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
  .track{height:6px;background:#18232f;border-radius:99px;position:relative;cursor:pointer;overflow:hidden}
  .track:hover{background:#1d2a38}
  .track .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),#4b9cff);transition:width .18s linear}
  .track .knob{position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;background:#eaf7ff;
    transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(53,214,200,.22);transition:left .18s linear}
  .time-row{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);
    font-family:"Cascadia Code",Consolas,monospace;margin-top:7px}
  .ctrl-row{display:flex;align-items:center;gap:10px;margin-top:11px}
  .icon-btn{
    width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);
    color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.15s;font-size:14px;
  }
  .icon-btn:hover{border-color:#2e4052;background:#16202a}
  .icon-btn:disabled{opacity:.35;cursor:not-allowed}
  .icon-btn.play{background:linear-gradient(135deg,var(--accent),#1f9d95);border-color:transparent;color:#04211f;
    box-shadow:0 6px 16px rgba(53,214,200,.22)}
  .icon-btn.loop-on{border-color:rgba(111,140,255,.5);color:#b9c6ff;background:rgba(111,140,255,.12)}
  .vol{display:flex;align-items:center;gap:8px;margin-left:auto}
  .vol input[type=range]{width:110px;accent-color:var(--accent);cursor:pointer}
  .vol span{font-size:11px;color:var(--dim);width:32px;text-align:right;font-family:"Cascadia Code",monospace}

  /* ---------------- 日志 ---------------- */
  .log-card{flex:0 0 176px;display:flex;flex-direction:column;padding-bottom:8px}
  .log-list{flex:1;overflow-y:auto;font-family:"Cascadia Code",Consolas,monospace;font-size:11.5px;line-height:1.7}
  .log-line{display:flex;gap:8px;padding:1px 0}
  .log-line .t{color:#3f5061;flex:0 0 auto}
  .log-line .m{color:#9fb2c4;word-break:break-all}
  .log-line.ok .m{color:#7ee2b8}
  .log-line.warn .m{color:#e8c37a}
  .log-line.error .m{color:#ff9d9d}

  .inline-note{font-size:11px;color:var(--dim);line-height:1.6;margin-top:8px}
  .inline-note code{background:#0a1017;border:1px solid var(--line);border-radius:5px;padding:1px 5px;
    color:#8fd8d2;font-family:"Cascadia Code",monospace;font-size:10.5px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  /* toast */
  #toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:99}
  .toast{
    background:#141d26;border:1px solid var(--line);border-left:3px solid var(--accent);
    padding:9px 14px;border-radius:10px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.45);
    animation:slidein .22s ease;max-width:380px;
  }
  .toast.err{border-left-color:var(--danger)}
  @keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">◉</div>
    <h1>虚拟音视频注入器</h1>
    <span class="ver">v1.0</span>
  </div>
  <div class="top-actions">
    <div class="pill" id="pill-state"><span class="dot"></span><span id="pill-text">未注入</span></div>
    <button class="btn primary" id="btn-start">开始注入</button>
    <button class="btn ghost danger" id="btn-stop" disabled>停止</button>
    <button class="btn ghost" id="btn-quit" title="停止注入并退出程序">退出</button>
  </div>
</header>

<main>
  <!-- 左栏 -->
  <div class="col">
    <div class="card">
      <h2>设备状态 <span class="hint" id="scan-time"></span></h2>
      <div class="dev">
        <div class="dot-lg" id="cam-dot"></div>
        <div class="dev-body">
          <div class="dev-title">虚拟摄像头 <span class="tag" id="cam-tag">—</span></div>
          <div class="dev-name" id="cam-name">检测中…</div>
          <div class="dev-msg" id="cam-msg"></div>
        </div>
      </div>
      <div class="dev">
        <div class="dot-lg" id="mic-dot"></div>
        <div class="dev-body">
          <div class="dev-title">虚拟麦克风 <span class="tag" id="mic-tag">—</span></div>
          <div class="dev-name" id="mic-name">检测中…</div>
          <div class="dev-msg" id="mic-msg"></div>
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" id="btn-scan" style="flex:1">重新扫描</button>
        <button class="btn sm" id="btn-selftest" style="flex:1">设备自检</button>
      </div>
      <div class="inline-note">
        应用端请选择 <code>OBS Virtual Camera</code> 与 <code>CABLE Output</code>。
        没装虚拟声卡？<a href="https://vb-audio.com/Cable/" target="_blank">下载 VB-CABLE</a>（免费）
      </div>
    </div>

    <div class="card">
      <h2>视频源</h2>
      <div class="field">
        <div class="label"><span>文件</span><span id="video-meta"></span></div>
        <div class="row">
          <input type="text" id="video-path" placeholder="选择或粘贴视频路径…" spellcheck="false">
          <button class="btn sm" id="btn-pick-video">浏览</button>
        </div>
      </div>
      <div class="row">
        <button class="btn sm" id="btn-load-path" style="flex:1">加载路径</button>
        <button class="btn sm" id="btn-demo" style="flex:1">载入演示素材</button>
      </div>
    </div>

    <div class="card">
      <h2>音频源 <span class="hint" id="audio-hint"></span></h2>
      <div class="seg" id="seg-audio" style="margin-bottom:10px">
        <button data-mode="video">跟随视频</button>
        <button data-mode="file">单独文件</button>
        <button data-mode="none">静音</button>
      </div>
      <div class="row" id="audio-file-row" style="display:none">
        <input type="text" id="audio-path" placeholder="音频文件路径…" spellcheck="false">
        <button class="btn sm" id="btn-pick-audio">浏览</button>
      </div>
      <div class="field" style="margin-top:10px">
        <div class="label"><span>输出端点（虚拟声卡）</span></div>
        <select id="audio-device"></select>
      </div>
    </div>

    <div class="card">
      <h2>输出参数</h2>
      <div class="row">
        <div class="field" style="flex:1">
          <div class="label"><span>分辨率</span></div>
          <select id="out-res">
            <option value="640x480">640 × 480</option>
            <option value="1280x720" selected>1280 × 720</option>
            <option value="1920x1080">1920 × 1080</option>
          </select>
        </div>
        <div class="field" style="flex:1">
          <div class="label"><span>帧率</span></div>
          <select id="out-fps">
            <option>15</option><option>24</option><option>25</option>
            <option selected>30</option><option>60</option>
          </select>
        </div>
      </div>
      <div class="inline-note">改动需在停止注入后生效；画面按等比缩放、两侧补黑边。</div>
    </div>
  </div>

  <!-- 右栏 -->
  <div class="col stage">
    <div class="stage-main">
      <div class="preview-card" id="preview-card">
        <img id="preview" alt="预览">
        <div class="placeholder" id="placeholder">尚未加载素材</div>
        <div class="preview-badge" id="preview-badge"><span class="dot"></span><span id="badge-text">空闲</span></div>
        <div class="preview-res" id="preview-res">—</div>
      </div>

      <div class="transport">
        <div class="track" id="track"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
        <div class="time-row"><span id="t-pos">00:00</span><span id="t-dur">00:00</span></div>
        <div class="ctrl-row">
          <button class="icon-btn play" id="btn-play" title="播放 / 暂停（空格）">▶</button>
          <button class="icon-btn" id="btn-back" title="回到开头">⏮</button>
          <button class="icon-btn" id="btn-loop" title="循环播放">⟳</button>
          <div class="vol">
            <span style="color:var(--dim);font-size:13px">🔊</span>
            <input type="range" id="volume" min="0" max="100" value="90">
            <span id="vol-val">90%</span>
          </div>
        </div>
      </div>

      <div class="card log-card">
        <h2>运行日志 <span class="hint" id="fps-hint"></span></h2>
        <div class="log-list" id="log-list"></div>
      </div>
    </div>
  </div>
</main>

<div id="toasts"></div>

<script>
const $ = s => document.querySelector(s);
let lastLogId = 0, lastState = null, dragging = false;
// ?still=1 时用静态帧轮询代替 MJPEG（无长连接，方便截图/录屏工具抓取）
const STILL = location.search.includes('still=1');

function toast(msg, isErr){
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(() => el.remove(), 320); }, 2600);
}

async function api(path, body){
  try{
    const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{})});
    const j = await r.json();
    if(j && j.ok === false && j.error) throw new Error(j.error);
    return j;
  }catch(e){ toast(e.message || '操作失败', true); throw e; }
}

function fmt(t){
  t = Math.max(0, t||0);
  const m = Math.floor(t/60), s = Math.floor(t%60);
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

/* ---------------- 渲染 ---------------- */
function render(s){
  lastState = s;

  // 顶栏
  const live = s.injecting;
  $('#pill-state').classList.toggle('live', live);
  const map = {playing:'注入中 · 播放', paused:'注入中 · 已暂停', ended:'注入中 · 已播完', idle:'未注入'};
  $('#pill-text').textContent = map[s.state] || '未注入';
  $('#btn-start').disabled = live;
  $('#btn-stop').disabled = !live;
  $('#btn-start').textContent = live ? '注入中' : '开始注入';

  // 设备
  const cam = s.camera, mic = s.mic;
  $('#cam-dot').className = 'dot-lg ' + (cam.ok ? 'ok' : 'bad');
  $('#cam-name').textContent = cam.ok ? cam.name : '未就绪';
  $('#cam-tag').textContent = cam.ok ? (cam.backend === 'obs' ? 'OBS' : 'Unity') : '缺失';
  $('#cam-msg').textContent = cam.ok ? '' : cam.message;
  $('#cam-msg').className = 'dev-msg' + (cam.ok ? '' : ' err');

  $('#mic-dot').className = 'dot-lg ' + (mic.ok ? 'ok' : 'bad');
  $('#mic-name').textContent = mic.ok ? mic.device.name : '未就绪';
  $('#mic-tag').textContent = mic.ok ? 'CABLE' : '缺失';
  $('#mic-msg').textContent = mic.ok ? '应用侧麦克风选择 “CABLE Output”' : mic.message;
  $('#mic-msg').className = 'dev-msg' + (mic.ok ? '' : ' err');

  // 音频设备下拉
  const sel = $('#audio-device');
  if(sel.dataset.sig !== JSON.stringify(mic.devices.map(d => d.index))){
    sel.dataset.sig = JSON.stringify(mic.devices.map(d => d.index));
    sel.innerHTML = mic.devices.map(d =>
      `<option value="${d.index}">${d.is_virtual ? '★ ' : ''}${d.name}</option>`).join('');
  }
  if(s.selected_audio != null) sel.value = String(s.selected_audio);

  // 视频
  const v = s.video;
  if(document.activeElement !== $('#video-path')){
    $('#video-path').value = v.path || '';
  }
  $('#video-meta').textContent = v.name ? `${v.width}×${v.height} · ${v.fps}fps` : '';
  $('#preview-res').textContent = v.name ? `${s.out.w}×${s.out.h} @ ${s.out.fps}fps` : '—';

  // 音频
  document.querySelectorAll('#seg-audio button').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === s.audio.source));
  $('#audio-file-row').style.display = s.audio.source === 'file' ? 'flex' : 'none';
  if(document.activeElement !== $('#audio-path')) $('#audio-path').value = s.audio.file || '';
  $('#audio-hint').textContent = s.audio.prep_state === 'working' ? '解析中…'
      : (s.audio.prep_state === 'error' ? '解析失败' : (s.audio.duration ? fmt(s.audio.duration) : ''));

  // 进度
  const dur = v.duration || 0, pos = s.pos || 0;
  const ratio = dur > 0 ? Math.min(1, pos / dur) : 0;
  if(!dragging){
    $('#fill').style.width = (ratio * 100) + '%';
    $('#knob').style.left = (ratio * 100) + '%';
  }
  $('#t-pos').textContent = fmt(pos);
  $('#t-dur').textContent = fmt(dur);

  // 按钮态
  $('#btn-play').textContent = s.state === 'paused' ? '▶' : '❚❚';
  $('#btn-play').disabled = !live;
  $('#btn-loop').classList.toggle('loop-on', s.loop);
  if(document.activeElement !== $('#volume')){
    $('#volume').value = Math.round(s.volume * 100);
    $('#vol-val').textContent = Math.round(s.volume * 100) + '%';
  }
  $('#fps-hint').textContent = live ? `已发送 ${s.frames_sent} 帧 · ${s.measured_fps}fps` : '';

  // 预览
  const card = $('#preview-card');
  const img = $('#preview');
  if(s.has_preview){
    if(STILL){
      img.src = '/preview.jpg?t=' + Date.now();
      img.dataset.on = '1';
      card.classList.add('has');
    }else if(img.dataset.on !== '1'){
      img.src = '/stream.mjpg?' + Date.now();
      img.dataset.on = '1';
      card.classList.add('has');
    }
  }else{
    card.classList.remove('has');
    img.dataset.on = '0'; img.removeAttribute('src');
    $('#placeholder').textContent = v.name ? '等待首帧…' : '尚未加载素材';
  }
  $('#preview-badge').classList.toggle('live', live && s.state === 'playing');
  $('#badge-text').textContent = live ? (s.state === 'paused' ? 'PAUSED' : 'ON AIR') : 'IDLE';

  // 日志
  if(s.logs && s.logs.length){
    const list = $('#log-list');
    const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
    for(const l of s.logs){
      const d = document.createElement('div');
      d.className = 'log-line ' + l.level;
      d.innerHTML = `<span class="t">${l.t}</span><span class="m"></span>`;
      d.querySelector('.m').textContent = l.msg;
      list.appendChild(d);
      lastLogId = Math.max(lastLogId, l.id);
    }
    while(list.children.length > 300) list.removeChild(list.firstChild);
    if(atBottom) list.scrollTop = list.scrollHeight;
  }
}

async function poll(){
  try{
    const r = await fetch('/api/state?since=' + lastLogId);
    const s = await r.json();
    render(s);
  }catch(e){ /* 服务可能正在重启 */ }
}

/* ---------------- 交互 ---------------- */
$('#btn-start').onclick = async () => { await api('/api/start'); poll(); };
$('#btn-stop').onclick = async () => { await api('/api/stop'); poll(); };
$('#btn-play').onclick = async () => { await api('/api/pause'); poll(); };
$('#btn-back').onclick = async () => { await api('/api/seek', {t:0}); poll(); };
$('#btn-loop').onclick = async () => { await api('/api/loop', {on: !(lastState && lastState.loop)}); poll(); };
$('#btn-scan').onclick = async () => { await api('/api/scan'); toast('已重新扫描设备'); poll(); };
$('#btn-quit').onclick = async () => {
  if(!confirm('停止注入并退出程序？')) return;
  try{ await fetch('/api/quit', {method:'POST'}); }catch(e){}
  document.body.innerHTML = '<div style="display:grid;place-items:center;height:100vh;color:#5d6f80;font-size:14px">程序已退出，可以关闭此窗口</div>';
};
$('#btn-selftest').onclick = async () => {
  toast('正在自检，虚拟麦克风会响 0.5 秒…');
  await api('/api/selftest'); poll();
};

$('#btn-pick-video').onclick = async () => {
  toast('请在弹出的窗口中选择视频文件…');
  const r = await api('/api/pick', {kind:'video'});
  if(r.path){ $('#video-path').value = r.path; await api('/api/load_video', {path: r.path}); poll(); }
};
$('#btn-load-path').onclick = async () => {
  const p = $('#video-path').value.trim();
  if(!p) return toast('请先填写视频路径', true);
  await api('/api/load_video', {path: p}); poll();
};
$('#btn-demo').onclick = async () => { await api('/api/load_video', {demo:true}); poll(); };

$('#btn-pick-audio').onclick = async () => {
  const r = await api('/api/pick', {kind:'audio'});
  if(r.path){ $('#audio-path').value = r.path; await api('/api/audio_source', {mode:'file', path:r.path}); poll(); }
};

document.querySelectorAll('#seg-audio button').forEach(b => {
  b.onclick = async () => {
    const mode = b.dataset.mode;
    let path = null;
    if(mode === 'file'){
      path = $('#audio-path').value.trim();
      if(!path){ toast('请先选择一个音频文件', true); return; }
    }
    await api('/api/audio_source', {mode, path});
    poll();
  };
});

$('#audio-device').onchange = async e => { await api('/api/audio_device', {index: +e.target.value}); poll(); };
$('#out-res').onchange = async e => {
  const [w,h] = e.target.value.split('x').map(Number);
  await api('/api/output', {w, h}); poll();
};
$('#out-fps').onchange = async e => { await api('/api/output', {fps: +e.target.value}); poll(); };
$('#volume').oninput = e => {
  $('#vol-val').textContent = e.target.value + '%';
  fetch('/api/volume', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({v: e.target.value/100})});
};

// 进度条拖拽
const track = $('#track');
function seekFromEvent(ev){
  const r = track.getBoundingClientRect();
  const x = Math.min(Math.max(0, ev.clientX - r.left), r.width);
  const ratio = r.width > 0 ? x / r.width : 0;
  $('#fill').style.width = (ratio*100)+'%';
  $('#knob').style.left = (ratio*100)+'%';
  return ratio;
}
track.addEventListener('mousedown', e => {
  if(!lastState || !lastState.video.duration) return;
  dragging = true;
  seekFromEvent(e);
  const up = ev => {
    const ratio = seekFromEvent(ev);
    dragging = false;
    document.removeEventListener('mouseup', up);
    api('/api/seek', {t: ratio * lastState.video.duration}).then(poll);
  };
  document.addEventListener('mouseup', up);
});
track.addEventListener('mousemove', e => { if(dragging) seekFromEvent(e); });

// 空格 = 播放/暂停
document.addEventListener('keydown', e => {
  if(e.code === 'Space' && !['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){
    e.preventDefault();
    if(lastState && lastState.injecting) api('/api/pause').then(poll);
  }
});

poll();
setInterval(poll, 500);
</script>
</body>
</html>
